<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Birthday AR Gift</title>

    <!-- A-Frame 1.5.0 + MindAR Image Tracking -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      body {
        position: fixed;
        inset: 0;
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
      }

      a-scene {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
      }

      .overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
        pointer-events: none;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.25));
      }

      .overlay.is-running {
        justify-content: flex-start;
        padding-top: max(28px, env(safe-area-inset-top));
        background: transparent;
      }

      #statusText {
        margin: 0;
        padding: 10px 14px;
        border-radius: 999px;
        color: #fff;
        font-size: 15px;
        line-height: 1.45;
        letter-spacing: 0.02em;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }

      .buttonGroup {
        display: flex;
        flex-direction: column;
        gap: 12px;
        pointer-events: auto;
      }

      .startButton {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 14px 24px;
        color: #111;
        background: #fff;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.02em;
        cursor: pointer;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
      }

      .startButton.secondary {
        color: #fff;
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.35);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }

      .startButton:active {
        transform: scale(0.98);
      }

      .buttonGroup[hidden] {
        display: none;
      }
    </style>
  </head>

  <body>
    <div id="overlay" class="overlay">
      <p id="statusText">請選擇啟動方式</p>

      <div id="buttonGroup" class="buttonGroup">
        <button id="startSoundButton" class="startButton" type="button">
          Start AR 開啟聲音
        </button>

        <button id="startMutedButton" class="startButton secondary" type="button">
          Start AR 靜音播放
        </button>
      </div>
    </div>

    <a-scene
      mindar-image="imageTargetSrc: ./targets/birthday_targets.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no;"
      color-space="sRGB"
      renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true; alpha: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      embedded>

      <a-assets>
        <!-- Target A 掃到時播放的影片 -->
        <video
          id="videoA"
          src="./assets/video_a.mp4"
          preload="auto"
          loop
          muted
          playsinline
          webkit-playsinline
          crossorigin="anonymous">
        </video>

        <!-- Target B 掃到時播放的影片 -->
        <video
          id="videoB"
          src="./assets/video_b.mp4"
          preload="auto"
          loop
          muted
          playsinline
          webkit-playsinline
          crossorigin="anonymous">
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!--
        targetIndex: 0 = 你在 MindAR Compiler 裡放的第一張圖片
        掃描第一張圖片時，播放 video_a.mp4
      -->
      <a-entity id="targetA" mindar-image-target="targetIndex: 0">
        <a-video
          src="#videoA"
          position="0 0.01 0.01"
          width="1.0"
          height="1.4"
          rotation="0 0 0">
        </a-video>
      </a-entity>

      <!--
        targetIndex: 1 = 你在 MindAR Compiler 裡放的第二張圖片
        掃描第二張圖片時，播放 video_b.mp4
      -->
      <a-entity id="targetB" mindar-image-target="targetIndex: 1">
        <a-video
          src="#videoB"
          position="0 0.0 0.01"
          width="1.02"
          height="1.5"
          rotation="0 0 0">
        </a-video>
      </a-entity>
    </a-scene>

    <script>
      const sceneEl = document.querySelector("a-scene");
      const overlayEl = document.querySelector("#overlay");
      const statusTextEl = document.querySelector("#statusText");
      const buttonGroupEl = document.querySelector("#buttonGroup");
      const startSoundButtonEl = document.querySelector("#startSoundButton");
      const startMutedButtonEl = document.querySelector("#startMutedButton");

      const targetAEl = document.querySelector("#targetA");
      const targetBEl = document.querySelector("#targetB");

      const videoAEl = document.querySelector("#videoA");
      const videoBEl = document.querySelector("#videoB");
      const videoEls = [videoAEl, videoBEl];

      let soundEnabled = false;
      let arStarted = false;
      let activeVideoEl = null;

      const setStatus = (message) => {
        statusTextEl.textContent = message;
      };

      const pauseAllVideos = () => {
        for (const videoEl of videoEls) {
          if (!videoEl) continue;
          videoEl.pause();
          videoEl.currentTime = 0;
        }
        activeVideoEl = null;
      };

      const unlockVideos = async () => {
        for (const videoEl of videoEls) {
          if (!videoEl) continue;

          videoEl.muted = !soundEnabled;
          videoEl.playsInline = true;

          try {
            await videoEl.play();
            videoEl.pause();
            videoEl.currentTime = 0;
          } catch (err) {
            console.warn("Video unlock with sound failed, fallback to muted:", err);

            soundEnabled = false;
            videoEl.muted = true;

            try {
              await videoEl.play();
              videoEl.pause();
              videoEl.currentTime = 0;
            } catch (mutedErr) {
              console.warn("Muted video unlock also failed:", mutedErr);
            }

            setStatus("手機阻擋聲音，已改為靜音播放");
          }
        }
      };

      const startAR = async (enableSound) => {
        if (arStarted) return;

        arStarted = true;
        soundEnabled = enableSound;

        buttonGroupEl.hidden = true;
        overlayEl.classList.add("is-running");
        setStatus("Loading AR...");

        try {
          if (!sceneEl.hasLoaded) {
            await new Promise((resolve) => {
              sceneEl.addEventListener("loaded", resolve, { once: true });
            });
          }

          await unlockVideos();

          const mindarSystem = sceneEl.systems["mindar-image-system"];
          await mindarSystem.start();

          setStatus("Scanning... 請將相機對準生日卡片或照片");
        } catch (error) {
          console.error(error);

          arStarted = false;
          buttonGroupEl.hidden = false;
          overlayEl.classList.remove("is-running");
          setStatus("無法開啟相機，請檢查瀏覽器相機權限與 HTTPS 設定。");
        }
      };

      const playVideoForTarget = async (videoEl, label) => {
        if (!videoEl) return;

        pauseAllVideos();

        activeVideoEl = videoEl;
        videoEl.currentTime = 0;
        videoEl.muted = !soundEnabled;

        setStatus(soundEnabled ? `${label} found，影片播放中` : `${label} found，靜音播放中`);

        try {
          await videoEl.play();
        } catch (err) {
          console.warn("Video play failed on targetFound, fallback to muted:", err);

          soundEnabled = false;
          videoEl.muted = true;

          try {
            await videoEl.play();
            setStatus(`${label} found，但手機阻擋聲音，已改為靜音播放`);
          } catch (mutedErr) {
            console.warn("Muted video play failed:", mutedErr);
            setStatus(`${label} found，但影片播放被手機阻擋`);
          }
        }
      };

      const pauseVideoForTarget = (videoEl) => {
        if (videoEl && activeVideoEl === videoEl) {
          videoEl.pause();
          activeVideoEl = null;
          setStatus("Scanning... 請將相機對準生日卡片或照片");
        }
      };

      startSoundButtonEl.addEventListener("click", () => {
        startAR(true);
      });

      startMutedButtonEl.addEventListener("click", () => {
        startAR(false);
      });

      targetAEl.addEventListener("targetFound", () => {
        playVideoForTarget(videoAEl, "Target A");
      });

      targetAEl.addEventListener("targetLost", () => {
        pauseVideoForTarget(videoAEl);
      });

      targetBEl.addEventListener("targetFound", () => {
        playVideoForTarget(videoBEl, "Target B");
      });

      targetBEl.addEventListener("targetLost", () => {
        pauseVideoForTarget(videoBEl);
      });
    </script>
  </body>
</html>
